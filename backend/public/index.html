<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Smart Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #07080D;
      --bg-card: #0E1118;
      --bg-elevated: #141720;
      --amber: #E8A93C;
      --amber-dim: #9A6E25;
      --amber-glow: rgba(232, 169, 60, 0.15);
      --amber-glow-strong: rgba(232, 169, 60, 0.3);
      --text-primary: #EAE8E0;
      --text-secondary: #7A7D8C;
      --text-muted: #3D4055;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --active-teal: #2ABFAA;
      --active-teal-glow: rgba(42, 191, 170, 0.15);
      --danger: #E05252;
      --radius-card: 20px;
      --radius-sm: 10px;
    }

    html { background: var(--bg-base); min-height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(232,169,60,0.07) 0%, transparent 60%),
        var(--bg-base);
      min-height: 100vh;
      color: var(--text-primary);
      padding: 0 0 60px;
    }

    /* ── Header ── */
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 36px 48px 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--amber) 0%, #C47E1A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(232,169,60,0.35);
    }

    .logo-mark svg { width: 20px; height: 20px; fill: #07080D; }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .logo-text span { color: var(--amber); }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .date-chip {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 16px 7px 10px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.4s;
      flex-shrink: 0;
    }

    .status-chip.connected .status-dot {
      background: var(--active-teal);
      box-shadow: 0 0 8px var(--active-teal);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    .status-chip.connected { color: var(--text-primary); }
    .status-chip.error .status-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ── Main grid ── */
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 48px 48px 0;
    }

    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    /* ── Device Card ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, var(--amber-glow) 0%, transparent 70%);
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .card.active::before { opacity: 1; }
    .card.active { border-color: rgba(232,169,60,0.2); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .device-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .card.active .device-icon {
      background: var(--amber-glow);
      border-color: var(--amber-dim);
      box-shadow: 0 0 16px var(--amber-glow-strong);
    }

    .device-icon svg { width: 22px; height: 22px; transition: stroke 0.3s; }
    .card .device-icon svg { stroke: var(--text-muted); }
    .card.active .device-icon svg { stroke: var(--amber); }

    .device-info { flex: 1; padding-left: 16px; }

    .device-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: 0.01em;
    }

    .device-room {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    /* ── Toggle Switch ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.3s;
      min-width: 28px;
    }

    .toggle-label.on-label { color: var(--amber); }

    .toggle {
      position: relative;
      width: 52px;
      height: 28px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 100px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hover);
      transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    }

    .toggle input:checked ~ .toggle-track {
      background: var(--amber);
      border-color: var(--amber);
      box-shadow: 0 0 20px rgba(232,169,60,0.45);
    }

    .toggle-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.35s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .toggle input:checked ~ .toggle-track .toggle-thumb {
      transform: translateX(24px);
      background: #07080D;
    }

    /* ── Range Slider ── */
    .slider-section { margin-top: 24px; }

    .slider-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .slider-meta-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .slider-value {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: color 0.3s;
      line-height: 1;
    }

    .slider-value span { font-size: 14px; font-weight: 400; margin-left: 2px; }
    .slider-value.active { color: var(--amber); }

    .slider-track-wrap {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
    }

    .range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: transparent;
      outline: none;
      position: relative;
      z-index: 2;
      cursor: pointer;
    }

    .range-bg {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      border-radius: 2px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      overflow: hidden;
      z-index: 1;
    }

    .range-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 2px;
      transition: width 0.05s, background 0.3s;
      box-shadow: 0 0 8px rgba(232,169,60,0.5);
      width: 0%;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-primary);
      border: 3px solid var(--bg-base);
      box-shadow: 0 0 0 1px var(--amber), 0 0 12px rgba(232,169,60,0.5);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .range-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-primary);
      border: 3px solid var(--bg-base);
      box-shadow: 0 0 0 1px var(--amber), 0 0 12px rgba(232,169,60,0.5);
      cursor: pointer;
    }

    .range-input::-webkit-slider-thumb:hover { transform: scale(1.15); }

    /* Speed indicators (dots row) */
    .speed-dots {
      display: flex;
      gap: 5px;
      margin-top: 12px;
    }

    .speed-dot {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border-hover);
      transition: background 0.25s;
    }

    .speed-dot.lit { background: var(--amber); box-shadow: 0 0 4px rgba(232,169,60,0.6); }

    /* ── Fan card extra ── */
    .rpm-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-elevated);
      margin-top: 10px;
      transition: color 0.3s, border-color 0.3s;
    }

    .rpm-badge.active { color: var(--amber); border-color: var(--amber-dim); }
    .rpm-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ── Summary bar ── */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .stat-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-tile-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .stat-tile-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-tile-sub {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* Responsive */
    @media (max-width: 720px) {
      header { padding: 24px 24px 20px; }
      main { padding: 32px 24px 0; }
      .summary-bar { grid-template-columns: repeat(2, 1fr); }
      .header-meta .date-chip { display: none; }
    }

    /* Animations */
    .card { animation: fade-up 0.5s ease-out both; }
    .card:nth-child(2) { animation-delay: 0.07s; }
    .card:nth-child(3) { animation-delay: 0.14s; }
    .card:nth-child(4) { animation-delay: 0.21s; }
    .stat-tile { animation: fade-up 0.4s ease-out both; }
    .stat-tile:nth-child(2) { animation-delay: 0.05s; }
    .stat-tile:nth-child(3) { animation-delay: 0.1s; }
    .stat-tile:nth-child(4) { animation-delay: 0.15s; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Divider line */
    .section-divider { border: none; border-top: 1px solid var(--border); margin-bottom: 32px; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="logo-text">NEX<span>US</span></span>
    </div>
    <div class="header-meta">
      <span class="date-chip" id="live-date"></span>
      <div class="status-chip" id="status-chip">
        <span class="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>
  </header>

  <main>

    <!-- ── Stats row ── -->
    <div class="summary-bar">
      <div class="stat-tile">
        <span class="stat-tile-label">Devices</span>
        <span class="stat-tile-value" id="stat-total">4</span>
        <span class="stat-tile-sub">registered</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile-label">Active</span>
        <span class="stat-tile-value" id="stat-active">—</span>
        <span class="stat-tile-sub">powered on</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile-label">Avg Speed</span>
        <span class="stat-tile-value" id="stat-speed">—</span>
        <span class="stat-tile-sub">fan speed %</span>
      </div>
      <div class="stat-tile">
        <span class="stat-tile-label">Last Sync</span>
        <span class="stat-tile-value" style="font-size:18px;" id="stat-sync">—</span>
        <span class="stat-tile-sub">seconds ago</span>
      </div>
    </div>

    <!-- ── Lighting section ── -->
    <p class="section-label">Lighting</p>
    <div class="grid">

      <!-- LED 1 -->
      <div class="card" id="card-led1">
        <div class="card-header">
          <div class="device-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </div>
          <div class="device-info">
            <p class="device-name">LED Strip 1</p>
            <p class="device-room">Living Room</p>
          </div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label" id="led1-off-label">OFF</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-led1" onchange="controlLed('led1', this.checked)">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </label>
          <span class="toggle-label on-label" id="led1-on-label" style="opacity:0.3">ON</span>
        </div>
      </div>

      <!-- LED 2 -->
      <div class="card" id="card-led2">
        <div class="card-header">
          <div class="device-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6"/><path d="M10 22h4"/>
            </svg>
          </div>
          <div class="device-info">
            <p class="device-name">Ambient LED 2</p>
            <p class="device-room">Bedroom</p>
          </div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label" id="led2-off-label">OFF</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-led2" onchange="controlLed('led2', this.checked)">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </label>
          <span class="toggle-label on-label" id="led2-on-label" style="opacity:0.3">ON</span>
        </div>
      </div>

    </div>

    <hr class="section-divider">

    <!-- ── Ventilation section ── -->
    <p class="section-label">Ventilation</p>
    <div class="grid">

      <!-- Fan 1 -->
      <div class="card" id="card-fan1">
        <div class="card-header">
          <div class="device-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 12c1.5-3 5-4 7-2s1 6-2 7c-3 1.5-4 5-2 7s6 1 7-2"/>
              <path d="M12 12c-3 1.5-4 5-2 7s6 1 7-2"/>
              <path d="M12 12c1.5 3-2 5-4 7"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <div class="device-info">
            <p class="device-name">Ceiling Fan 1</p>
            <p class="device-room">Living Room</p>
          </div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">OFF</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-fan1" onchange="controlFan('fan1', this.checked ? 'on' : 'off')">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </label>
          <span class="toggle-label on-label" style="opacity:0.3">ON</span>
        </div>

        <div class="slider-section">
          <div class="slider-meta">
            <span class="slider-meta-label">Speed</span>
            <span class="slider-value" id="val-fan1-speed">0<span>%</span></span>
          </div>
          <div class="slider-track-wrap">
            <div class="range-bg"><div class="range-fill" id="fill-fan1"></div></div>
            <input type="range" class="range-input" id="slider-fan1" min="0" max="100" value="0" step="1"
              oninput="controlFanSpeed('fan1', this.value)">
          </div>
          <div class="speed-dots" id="dots-fan1">
            <!-- 10 dots injected by JS -->
          </div>
          <div class="rpm-badge" id="rpm-fan1">
            <span class="rpm-badge-dot"></span>
            <span id="rpm-fan1-text">Standby</span>
          </div>
        </div>
      </div>

      <!-- Fan 2 -->
      <div class="card" id="card-fan2">
        <div class="card-header">
          <div class="device-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 12c1.5-3 5-4 7-2s1 6-2 7c-3 1.5-4 5-2 7s6 1 7-2"/>
              <path d="M12 12c-3 1.5-4 5-2 7s6 1 7-2"/>
              <path d="M12 12c1.5 3-2 5-4 7"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <div class="device-info">
            <p class="device-name">Ceiling Fan 2</p>
            <p class="device-room">Bedroom</p>
          </div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">OFF</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-fan2" onchange="controlFan('fan2', this.checked ? 'on' : 'off')">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </label>
          <span class="toggle-label on-label" style="opacity:0.3">ON</span>
        </div>

        <div class="slider-section">
          <div class="slider-meta">
            <span class="slider-meta-label">Speed</span>
            <span class="slider-value" id="val-fan2-speed">0<span>%</span></span>
          </div>
          <div class="slider-track-wrap">
            <div class="range-bg"><div class="range-fill" id="fill-fan2"></div></div>
            <input type="range" class="range-input" id="slider-fan2" min="0" max="100" value="0" step="1"
              oninput="controlFanSpeed('fan2', this.value)">
          </div>
          <div class="speed-dots" id="dots-fan2"></div>
          <div class="rpm-badge" id="rpm-fan2">
            <span class="rpm-badge-dot"></span>
            <span id="rpm-fan2-text">Standby</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    /* ── State ── */
    const deviceState = {
      led1: { on: false },
      led2: { on: false },
      fan1: { state: 'off', speed: 0 },
      fan2: { state: 'off', speed: 0 }
    };

    let activeCount = 0;
    let lastSync = null;

    /* ── Init dots ── */
    ['fan1', 'fan2'].forEach(fan => {
      const wrap = document.getElementById(`dots-${fan}`);
      for (let i = 0; i < 10; i++) {
        const d = document.createElement('div');
        d.className = 'speed-dot';
        d.id = `dot-${fan}-${i}`;
        wrap.appendChild(d);
      }
    });

    /* ── Live date ── */
    function updateDate() {
      const now = new Date();
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    }
    updateDate();

    /* ── Sync timer ── */
    setInterval(() => {
      if (lastSync) {
        const s = Math.round((Date.now() - lastSync) / 1000);
        document.getElementById('stat-sync').textContent = s;
      }
    }, 1000);

    /* ── Status ── */
    function setStatus(state, text) {
      const chip = document.getElementById('status-chip');
      chip.className = 'status-chip ' + state;
      document.getElementById('status-text').textContent = text;
    }

    /* ── Stats updater ── */
    function refreshStats() {
      const on = [
        deviceState.led1.on,
        deviceState.led2.on,
        deviceState.fan1.state === 'on',
        deviceState.fan2.state === 'on'
      ].filter(Boolean).length;

      document.getElementById('stat-active').textContent = on;

      const speeds = [deviceState.fan1.speed, deviceState.fan2.speed];
      const avg = Math.round(speeds.reduce((a,b)=>a+b,0) / speeds.length);
      document.getElementById('stat-speed').textContent = avg + '%';
    }

    /* ── LED control ── */
    function updateLedUI(ledName, turnOn) {
      const card = document.getElementById(`card-${ledName}`);
      card.classList.toggle('active', turnOn);
      const onLabel = document.getElementById(`${ledName}-on-label`);
      if (onLabel) onLabel.style.opacity = turnOn ? '1' : '0.3';
    }

    function controlLed(ledName, turnOn) {
      deviceState[ledName].on = turnOn;
      updateLedUI(ledName, turnOn);
      refreshStats();

      fetch(`/api/${ledName}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ on: turnOn })
      }).catch(() => {});
    }

    /* ── Fan on/off ── */
    function controlFan(fanName, state) {
      deviceState[fanName].state = state;
      const card = document.getElementById(`card-${fanName}`);
      const isOn = state === 'on';

      if (!isOn) {
        deviceState[fanName].speed = 0;
        document.getElementById(`slider-${fanName}`).value = 0;
        updateSliderUI(fanName, 0);
      } else if (deviceState[fanName].speed === 0) {
        // Automatically set speed to 100% if turned ON from 0
        deviceState[fanName].speed = 100;
        document.getElementById(`slider-${fanName}`).value = 100;
        updateSliderUI(fanName, 100);
      }

      card.classList.toggle('active', isOn);
      refreshStats();
      sendFanUpdate(fanName);
    }

    /* ── Fan speed ── */
    function controlFanSpeed(fanName, speed) {
      const num = parseInt(speed, 10);
      deviceState[fanName].speed = num;

      if (num > 0 && deviceState[fanName].state !== 'on') {
        deviceState[fanName].state = 'on';
        document.getElementById(`toggle-${fanName}`).checked = true;
        document.getElementById(`card-${fanName}`).classList.add('active');
      }

      updateSliderUI(fanName, num);
      refreshStats();
      sendFanUpdate(fanName);
    }

    function updateSliderUI(fanName, num) {
      const valEl = document.getElementById(`val-${fanName}-speed`);
      valEl.innerHTML = `${num}<span>%</span>`;
      valEl.className = 'slider-value' + (num > 0 ? ' active' : '');

      document.getElementById(`fill-${fanName}`).style.width = num + '%';

      const litCount = Math.round(num / 10);
      for (let i = 0; i < 10; i++) {
        document.getElementById(`dot-${fanName}-${i}`).className =
          'speed-dot' + (i < litCount ? ' lit' : '');
      }

      const rpmBadge = document.getElementById(`rpm-${fanName}`);
      const rpmText  = document.getElementById(`rpm-${fanName}-text`);

      if (num === 0) {
        rpmText.textContent = 'Standby';
        rpmBadge.className = 'rpm-badge';
      } else if (num < 34) {
        rpmText.textContent = 'Low — ' + Math.round(num * 4.5) + ' RPM';
        rpmBadge.className = 'rpm-badge active';
      } else if (num < 67) {
        rpmText.textContent = 'Medium — ' + Math.round(num * 4.5) + ' RPM';
        rpmBadge.className = 'rpm-badge active';
      } else {
        rpmText.textContent = 'High — ' + Math.round(num * 4.5) + ' RPM';
        rpmBadge.className = 'rpm-badge active';
      }
    }

    async function sendFanUpdate(fanName) {
      try {
        await fetch(`/api/${fanName}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(deviceState[fanName])
        });
      } catch (_) {}
    }

    /* ── Fetch & sync ── */
    async function fetchState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();

        if (data.led1 !== undefined) {
          deviceState.led1.on = data.led1;
          document.getElementById('toggle-led1').checked = data.led1;
          updateLedUI('led1', data.led1);
        }
        if (data.led2 !== undefined) {
          deviceState.led2.on = data.led2;
          document.getElementById('toggle-led2').checked = data.led2;
          updateLedUI('led2', data.led2);
        }
        if (data.fan1) {
          deviceState.fan1 = data.fan1;
          document.getElementById('toggle-fan1').checked = data.fan1.state === 'on';
          document.getElementById('slider-fan1').value = data.fan1.speed;
          updateSliderUI('fan1', data.fan1.speed);
          document.getElementById('card-fan1').classList.toggle('active', data.fan1.state === 'on');
        }
        if (data.fan2) {
          deviceState.fan2 = data.fan2;
          document.getElementById('toggle-fan2').checked = data.fan2.state === 'on';
          document.getElementById('slider-fan2').value = data.fan2.speed;
          updateSliderUI('fan2', data.fan2.speed);
          document.getElementById('card-fan2').classList.toggle('active', data.fan2.state === 'on');
        }

        lastSync = Date.now();
        document.getElementById('stat-sync').textContent = '0';
        setStatus('connected', 'Live');
        refreshStats();
      } catch (err) {
        setStatus('error', 'Offline');
      }
    }

    fetchState();
    setInterval(fetchState, 5000);
  </script>
</body>
</html>
